title: "[Question] "
labels: []
body:
  - type: markdown
    attributes:
      value: Do not include vulnerabilities, credentials, user content, personal paths, or private logs. Use the Bug Report form once a reproducible defect is confirmed.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Redacted context and what you already tried
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sanad version or commit, if relevant
