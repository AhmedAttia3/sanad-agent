name: Prepare stable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable GitHub Release after all gates pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_ARTIFACT_RETENTION_DAYS: 14

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-fvm
      - id: contract
        working-directory: agent
        shell: bash
        run: |
          fvm dart pub get
          version="$(jq -r '.version' ../release/release-contract.json)"
          contract_tag="$(jq -r '.tag' ../release/release-contract.json)"
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then tag="$contract_tag"; fi
          fvm dart run tool/release_tool.dart validate-contract \
            --repo-root .. --tag "$tag"
          if [[ "$GITHUB_REF_TYPE" == "tag" || "${{ inputs.publish }}" == "true" ]]; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$contract_tag" >> "$GITHUB_OUTPUT"
      - name: Refuse a mutable existing release
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.contract.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release already exists and is immutable." >&2
            exit 1
          fi

  agent:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            architecture: arm64
            extension: ''
            environment: apple-signing
          - runner: macos-15-intel
            platform: macos
            architecture: x64
            extension: ''
            environment: apple-signing
          - runner: ubuntu-24.04
            platform: linux
            architecture: x64
            extension: ''
            environment: release-build
          - runner: windows-2025
            platform: windows
            architecture: x64
            extension: .exe
            environment: windows-signing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Install dependencies and test
        working-directory: agent
        shell: bash
        run: |
          fvm dart pub get
          fvm dart analyze
          fvm dart test
      - name: Compile agent
        working-directory: agent
        shell: bash
        run: |
          mkdir -p ../dist
          fvm dart compile exe bin/sanad_agent.dart \
            -o "../dist/sanad-agent-${{ needs.validate.outputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}${{ matrix.extension }}"
      - name: Import Apple Developer ID
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$APPLE_KEY_BASE64"
          keychain="$RUNNER_TEMP/sanad-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: NanoSoft LY LLC ([^"]*)\)".*/\1/p' |
            head -n 1)"
          test -n "$identity"
          codesign --force --options runtime --timestamp --sign "$identity" \
            "dist/sanad-agent-${{ needs.validate.outputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}${{ matrix.extension }}"
          codesign --verify --strict --verbose=2 \
            "dist/sanad-agent-${{ needs.validate.outputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}${{ matrix.extension }}"
      - name: Notarize macOS agent
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          agent="dist/sanad-agent-${{ needs.validate.outputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}"
          archive="$RUNNER_TEMP/sanad-agent-notarization.zip"
          ditto -c -k --keepParent "$agent" "$archive"
          xcrun notarytool submit "$archive" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          spctl --assess --type execute --verbose=2 "$agent"
      - name: Sign Windows agent
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) { throw "Windows signing certificate is required." }
          $certificate = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $env:WINDOWS_SIGNING_CERTIFICATE_PATH = $certificate
          ./client/release/windows/sign_windows.ps1 -Paths @(
            "dist/sanad-agent-${{ needs.validate.outputs.version }}-windows-x64.exe"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  client-linux-web:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev
      - name: Build Linux and Web
        working-directory: client
        run: |
          fvm flutter pub get
          fvm flutter build linux --release --dart-define-from-file=config/prod.json
          fvm flutter build web --release --dart-define-from-file=config/prod.json
          printf '%s\n' '{"version":"${{ needs.validate.outputs.version }}","build":1}' \
            > build/web/version.json
          mkdir -p ../dist
          tar -C build/linux/x64/release -czf \
            "../dist/sanad-client-${{ needs.validate.outputs.version }}-linux-x64.tar.gz" bundle
          tar -C build/web -czf \
            "../dist/sanad-client-${{ needs.validate.outputs.version }}-web-universal.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: client-linux-web
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  client-android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-signing
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Restore Android signing material
        working-directory: client
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sanad-release.jks"
          chmod 600 "$RUNNER_TEMP/sanad-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/sanad-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          chmod 600 android/key.properties
      - name: Build signed Android artifacts
        working-directory: client
        run: |
          fvm flutter pub get
          fvm flutter build apk --release --dart-define-from-file=config/prod.json
          fvm flutter build appbundle --release --dart-define-from-file=config/prod.json
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../dist/sanad-client-${{ needs.validate.outputs.version }}-android-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "../dist/sanad-client-${{ needs.validate.outputs.version }}-android-universal.aab"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --verbose "../dist/sanad-client-${{ needs.validate.outputs.version }}-android-universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  client-macos:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    environment: apple-signing
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Restore Apple and Sparkle signing material
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SPARKLE_KEY_BASE64: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY_BASE64 }}
          APPLE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          keychain="$RUNNER_TEMP/sanad-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$SPARKLE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$APPLE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP"/*
          security create-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
      - name: Build signed and notarized DMG
        working-directory: client
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          brew install create-dmg
          fvm flutter pub get
          (cd macos && pod install)
          macos/Pods/Sparkle/bin/generate_keys -f "$RUNNER_TEMP/sparkle-private-key"
          release/macos/release_macos.sh
          mkdir -p ../dist
          cp "build/sanad-client-${{ needs.validate.outputs.version }}-macos-universal.dmg"* ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  client-windows:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 60
    environment: windows-signing
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Restore Windows signing material
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          DSA_KEY_BASE64: ${{ secrets.WINSPARKLE_DSA_PRIVATE_KEY_BASE64 }}
        run: |
          if (-not $env:CERTIFICATE_BASE64 -or -not $env:DSA_KEY_BASE64) {
            throw "Windows signing and WinSparkle keys are required."
          }
          $certificate = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          $dsaKey = Join-Path $env:RUNNER_TEMP "dsa_priv.pem"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          [IO.File]::WriteAllBytes($dsaKey, [Convert]::FromBase64String($env:DSA_KEY_BASE64))
          "WINDOWS_SIGNING_CERTIFICATE_PATH=$certificate" >> $env:GITHUB_ENV
          "WINSPARKLE_PRIVATE_KEY_PATH=$dsaKey" >> $env:GITHUB_ENV
      - name: Build signed Windows installer
        working-directory: client
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          fvm flutter pub get
          ./release/windows/release.ps1
          New-Item -ItemType Directory -Path ../dist -Force | Out-Null
          Copy-Item "build/sanad-client-${{ needs.validate.outputs.version }}-windows-x64.exe*" ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  assemble:
    needs: [validate, agent, client-linux-web, client-android, client-macos, client-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Generate and verify release metadata
        working-directory: agent
        run: |
          fvm dart pub get
          fvm dart run tool/release_tool.dart generate-manifest \
            --repo-root .. \
            --artifacts ../dist \
            --commit "$GITHUB_SHA" \
            --output ../dist/release-manifest.json
          fvm dart run tool/release_tool.dart verify-manifest \
            --manifest ../dist/release-manifest.json \
            --artifacts ../dist
          fvm dart run tool/release_tool.dart generate-appcast \
            --manifest ../dist/release-manifest.json \
            --output ../dist/appcast.xml \
            --published-at "$(git show -s --format=%cI "$GITHUB_SHA")"
          (cd ../dist && sha256sum appcast.xml >> SHA256SUMS)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sanad-${{ needs.validate.outputs.version }}.spdx.json
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/sanad-*
            dist/release-manifest.json
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stable-release-candidate
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Publish immutable GitHub Release
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t public_assets < <(
            jq -r '.artifacts[] | select(.public == true) | "dist/" + .filename' \
              release/release-contract.json
          )
          metadata=(
            dist/release-manifest.json
            dist/SHA256SUMS
            dist/appcast.xml
            dist/sanad-${{ needs.validate.outputs.version }}.spdx.json
          )
          gh release create "${{ needs.validate.outputs.tag }}" \
            "${public_assets[@]}" "${metadata[@]}" \
            --verify-tag \
            --title "Sanad ${{ needs.validate.outputs.version }}" \
            --generate-notes
